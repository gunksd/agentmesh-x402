<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AgentMesh paw">
  <title>AgentMesh</title>

  <!--
    AgentMesh mark: a rounded cat paw print.

    Four toes plus a heart-shaped main pad, all soft rounded forms. Blue on the
    app's off-white (#0B63F6 on #F6F9FE). Shapes are deliberately fat and
    well-separated so the print still reads as a paw at 16px, where anything
    finer collapses into a blob.
  -->

  <rect width="64" height="64" rx="15" fill="#F6F9FE"/>
  <rect x="1" y="1" width="62" height="62" rx="14.5" fill="none" stroke="#E3EAF5" stroke-width="2"/>

  <!-- Toes: outer pair tilted outward, inner pair upright and slightly larger. -->
  <g fill="#0B63F6">
    <ellipse cx="15.6" cy="27.4" rx="6.1" ry="7.4" transform="rotate(-20 15.6 27.4)"/>
    <ellipse cx="26.4" cy="19.2" rx="6.4" ry="8.1" transform="rotate(-7 26.4 19.2)"/>
    <ellipse cx="37.6" cy="19.2" rx="6.4" ry="8.1" transform="rotate(7 37.6 19.2)"/>
    <ellipse cx="48.4" cy="27.4" rx="6.1" ry="7.4" transform="rotate(20 48.4 27.4)"/>
  </g>

  <!-- Toe highlights, one per toe, for a little depth. -->
  <g fill="#7FA9F7" opacity="0.55">
    <ellipse cx="14.2" cy="24.4" rx="2.2" ry="2.8" transform="rotate(-20 14.2 24.4)"/>
    <ellipse cx="25.2" cy="15.6" rx="2.3" ry="3" transform="rotate(-7 25.2 15.6)"/>
    <ellipse cx="36.4" cy="15.6" rx="2.3" ry="3" transform="rotate(7 36.4 15.6)"/>
    <ellipse cx="47.2" cy="24.4" rx="2.2" ry="2.8" transform="rotate(20 47.2 24.4)"/>
  </g>

  <!--
    Main pad: a wide heart, which is the shape a real paw pad takes. Two top
    lobes meeting in a soft dip, tapering to a rounded point at the bottom.
  -->
  <path d="M32 55.4c-7.4-4.2-13.4-8.8-13.4-16.2 0-5.4 4.2-9.2 9.1-9.2 2 0 3.5.7 4.3 1.8.8-1.1 2.3-1.8 4.3-1.8 4.9 0 9.1 3.8 9.1 9.2 0 7.4-6 12-13.4 16.2Z"
        fill="#0B63F6"/>
  <path d="M25.6 34.4c-2.6.9-4.3 3-4.3 5.6"
        fill="none" stroke="#7FA9F7" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
</svg>
